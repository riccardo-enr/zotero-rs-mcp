[package]
name = "zotero-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for the Zotero local connector API"

[[bin]]
name = "zotero-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "1", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "5"
minreq = { version = "2", features = ["json-using-serde"] }
urlencoding = "2"
toml = "0.8"

[profile.release]
strip = true
opt-level = "s"
lto = true
codegen-units = 1
